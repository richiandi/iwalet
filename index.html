.ld{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}.ld b{font-size:16px;min-height:22px}

@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-8deg)}}@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(350%)}}
@media (prefers-reduced-motion:reduce){.ldj span,.ldb i{animation:none!important}}
.hero.sm{padding:16px;margin:14px 0 12px}.hero.sm .big{font-size:36px;margin:2px 0 10px}

.slim{display:flex;align-items:center;gap:10px;padding:8px 14px;margin:12px 0 0}.al{background:#fdefd9;color:#8a5a10;border-radius:16px;padding:10px 14px;font-size:13px;font-weight:600;margin-top:12px;display:flex;justify-content:space-between;gap:8px}
.empty{text-align:center;color:var(--mu);padding:26px 10px;font-size:14px}
.av .arm{transform-box:view-box;transform-origin:88px 94px}.av .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}.av .sp{opacity:0}
.av.work .arm{animation:stir .7s ease-in-out infinite alternate}.av.work .prop{animation:bob .35s ease-in-out infinite alternate}.av.work .sp{animation:tw 1.2s ease-in-out infinite}.av.work .sp2{animation-delay:.6s}
@keyframes stir{from{transform:rotate(-20deg)}to{transform:rotate(18deg)}}@keyframes bob{to{transform:translateY(-3px)}}@keyframes tw{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.av *{animation:none!important}}
</style></head>
<body><div id="app"></div><div id="ov" onclick="if(event.target===this)closeSh()"><div id="sh"></div></div><div id="wk"></div><div id="sc"></div><div id="toast"></div>
<script>
const K='byza_nutri_v2',$=i=>document.getElementById(i),rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID'),today=()=>new Date().toLocaleDateString('sv'),uid=()=>Math.random().toString(36).slice(2,9);
const ST=['Proses','Pending','Terkirim'],CH=['Shopee','Tokopedia','Offline'],PC=['#ece8fb','#fde6ee','#fdeedd','#e3f5ea'];
let S,tab='home',flt='Semua',tmp={},show=false,per='bulan',ROLE='staff',lk=0;
S=seed();
/* GANTI dengan URL Web App Apps Script Anda (berakhiran /exec) */
const API_URL='https://script.google.com/macros/s/AKfycbznDVr7gBfjN1_48Pn7JvpqqfZVH8WPvquDZoiBHbghQy76QXo-F1yYH85hB0K5JhV-/exec';
const GS=(function(){function mk(ok,bad){return new Proxy({},{get(_,n){if(n==='withSuccessHandler')return f=>mk(f,bad);if(n==='withFailureHandler')return f=>mk(ok,f);return(...a)=>{if(API_URL.indexOf('/exec')<0){bad&&bad(new Error('API_URL belum diisi di index.html'));return}fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:n,args:a})}).then(r=>r.json()).then(r=>{if(r.error)throw new Error(r.error);ok&&ok(r.result)}).catch(e=>bad&&bad(e))}}})}return mk(null,null)})();let VER=0,base=null,dirty=false,syncing=false,net='ok',sk='stok',tk={r:'staff',h:''};
const CK='byza_cache_v1',PK='byza_pins_v1',clone=x=>JSON.parse(JSON.stringify(x));
const pc=()=>{try{return JSON.parse(localStorage.getItem(PK))||{}}catch(e){return{}}},pcs=(r,h)=>{try{const p=pc();p[r]=h;localStorage.setItem(PK,JSON.stringify(p))}catch(e){}};
function cache(){try{localStorage.setItem(CK,JSON.stringify({S:S,base:base,dirty:dirty,VER:VER}))}catch(e){toast('Memori perangkat penuh. Sambungkan internet agar foto terunggah.')}}
function setNet(n){net=n;const e=$('net');if(e){e.textContent={ok:'Tersinkron ✓',sync:'Menyinkronkan…',wait:'Menunggu sinkron',off:'Offline'}[n];e.className='badge '+({ok:'b-ok',sync:'',wait:'b-wn',off:'b-wn'}[n])}}
const save=()=>{dirty=true;cache();setNet(navigator.onLine?'sync':'off');sync()};
function strip(x){x.P.forEach(p=>{p.pr=0;p.hp=0});x.M.forEach(m=>m.c=0);x.oh=0;x.sales.forEach(s=>s.items.forEach(i=>i.pr=0))}
function lock(){const go=()=>{ROLE='staff';tk={r:'staff',h:''};if(!dirty){strip(S);if(base)strip(base);cache()}render();refresh(render)};if(dirty&&navigator.onLine)sync(go);else go()}
function pendingImgs(){const l=[];S.buys.forEach(b=>['f1','f2'].forEach(k=>{if((b[k]||'').indexOf('data:')===0)l.push([b,k])}));S.sales.forEach(x=>{if((x.bk||'').indexOf('data:')===0)l.push([x,'bk'])});return l}
function upAll(ok,fail){const l=pendingImgs();if(!l.length)return ok();const o=l[0][0],k=l[0][1];GS.withSuccessHandler(u=>{o[k]=u;cache();upAll(ok,fail)}).withFailureHandler(fail).uploadImg(o[k])}
function sync(done){
if(!dirty||!navigator.onLine||syncing){if(done)done();return}
syncing=true;setNet('sync');
upAll(()=>{const snap=JSON.stringify(S),sb=base?JSON.stringify(base):'null';
GS.withSuccessHandler(r=>{syncing=false;VER=r.v;
if(JSON.stringify(S)===snap){S=r.s;base=clone(S);dirty=false;cache();setNet('ok');render();if(done)done()}
else{base=JSON.parse(snap);cache();sync(done)}
}).withFailureHandler(e=>{syncing=false;setNet('wait');if(!/fetch|network|load failed/i.test(String(e.message)))toast('Gagal sinkron: '+e.message);if(done)done()}).sync(snap,sb,tk.r,tk.h)},
()=>{syncing=false;setNet('wait');if(done)done()})}
function refresh(cb){
if(!navigator.onLine){if(cb)cb();return}
if(dirty)return sync(()=>{if(dirty){if(cb)cb()}else refresh(cb)});
GS.withSuccessHandler(x=>{VER=x.v;if(x.s&&!dirty){S=x.s;base=clone(S);cache()}if(cb)cb()}).withFailureHandler(()=>{if(cb)cb()}).getState(tk.r,tk.h)}
function poll(){if(['ov','wk','sc'].some(i=>$(i).classList.contains('on'))||syncing||!navigator.onLine)return;if(dirty)return sync();GS.withSuccessHandler(v=>{if(v!==VER)refresh(render)}).getVersion()}
function boot(){let c=null;try{c=JSON.parse(localStorage.getItem(CK))}catch(e){}
if(c&&c.S&&c.S.P){S=c.S;base=c.base||null;dirty=!!c.dirty;VER=c.VER||0;if(!dirty){strip(S);if(base)strip(base);cache()}net=!navigator.onLine?'off':(dirty?'sync':'ok');render();if(dirty)sync();else refresh(render);return}
if(!navigator.onLine){$('app').innerHTML='<div class="empty">Buka aplikasi sekali saat online untuk pertama kali.</div>';return}
GS.withSuccessHandler(r=>{VER=r.v;if(r.s){S=r.s;base=clone(S);dirty=false}else{S=seed();base=null;dirty=true}cache();render();if(dirty)sync()}).withFailureHandler(e=>{$('app').innerHTML='<div class="empty">Gagal memuat data: '+e.message+'</div>'}).getState('staff','')}
function openSheet(){if(!navigator.onLine)return toast('Perlu internet');GS.withSuccessHandler(u=>sh('Google Sheet',`<a class="btn" style="display:block;text-align:center;text-decoration:none" href="${u}" target="_blank" rel="noopener">Buka Spreadsheet</a><p class="mu" style="word-break:break-all">${u}</p>`)).withFailureHandler(e=>toast('Gagal: '+e.message)).sheetUrl()}
const mcost=m=>{if(m.c>0)return m.c;const b=S.buys.find(x=>x.bm===m.id&&x.bs>0);return b?b.v/b.bs:0};
const hppJar=()=>S.M.reduce((a,m)=>a+(S.R[m.id]||0)*mcost(m),0)+(+S.oh||0);
const hppP=p=>(p.j>0?p.j*hppJar():(p.hp||0))+pkCost(p);
function vStock(){return vStock0()}
const fmt=n=>Math.round(n*100)/100,esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const prodUse=p=>{if(p.u)return p.u;const u={};S.M.forEach(m=>{const c=S.R[m.id]||0;if(c>0)u[m.id]=c*p.q});return u};
function calcProd(){const e=$('pcalc');if(!e)return;const q=+$('pq').value||0,rows=S.M.filter(m=>(S.R[m.id]||0)>0);
if(!rows.length){e.innerHTML='<span class="mu">Komposisi belum diatur admin.</span>';return}
let cost=0;e.innerHTML=`<b>Kebutuhan bahan ${q?'untuk '+q+' jar':'per 1 jar'}</b>`+rows.map(m=>{const per=S.R[m.id],need=per*(q||1),left=m.st-need;cost+=need*mcost(m);return`<div class="row sp" style="margin-top:10px"><div>${esc(m.n)}<div class="mu">${fmt(per)} ${esc(m.u)} per jar</div></div><div style="text-align:right"><b>${fmt(need)} ${esc(m.u)}</b><div class="mu" style="color:${q&&left<0?'var(--bad)':'var(--mu)'}">${q?(left<0?'kurang '+fmt(-left):'sisa '+fmt(left)):'stok '+fmt(m.st)}</div></div></div>`}).join('')+(own()&&q?`<div class="mu" style="margin-top:12px">Perkiraan biaya bahan ${rp(cost)} (HPP per jar ${rp(hppJar())})</div>`:'')}
function openProdDetail(id){const p=S.prod.find(x=>x.id===id);if(!p)return;const u=prodUse(p),ed=adm();
sh('Detail produksi',`<div class="card"><div class="row sp"><b style="font-size:22px">${p.q} jar</b><span class="mu">${p.d}</span></div>${p.note?`<div class="mu" style="margin-top:6px">${esc(p.note)}</div>`:''}</div>
<h3 style="margin-top:16px">Komposisi yang terpakai</h3>
${ed?`<label>Jumlah jar</label><input id="dq" type="number" value="${p.q}" oninput="dqChg('${id}')"><label>Tanggal</label><input id="dd" type="date" value="${p.d}"><label>Catatan</label><input id="dn" value="${esc(p.note||'')}">`:''}
${S.M.map(m=>{const v=u[m.id]||0;return ed?`<label>${esc(m.n)} (${esc(m.u)})</label><input id="du_${m.id}" type="number" step="any" value="${fmt(v)}">`:v>0?`<div class="card row sp"><span>${esc(m.n)}</span><b>${fmt(v)} ${esc(m.u)}</b></div>`:''}).join('')}
${own()?`<div class="mu" style="margin:0 0 12px">Perkiraan biaya bahan: ${rp(S.M.reduce((a,m)=>a+(u[m.id]||0)*mcost(m),0))}</div>`:''}
${ed?`<button class="btn" onclick="saveProdDetail('${id}')">Simpan perubahan</button>`:'<p class="mu">Hanya Admin atau Owner yang dapat mengubah.</p>'}`)}
function dqChg(id){const p=S.prod.find(x=>x.id===id),u=prodUse(p),nq=+$('dq').value||0;S.M.forEach(m=>{const e=$('du_'+m.id);if(e)e.value=fmt(p.q>0?(u[m.id]||0)/p.q*nq:0)})}
function saveProdDetail(id){const p=S.prod.find(x=>x.id===id);if(!p||!adm())return;const old=prodUse(p),nq=+$('dq').value;if(!(nq>0))return toast('Jumlah jar harus lebih dari 0');const nu={};
S.M.forEach(m=>{const v=+$('du_'+m.id).value||0;if(v>0)nu[m.id]=v;const d=v-(old[m.id]||0);if(d)m.st-=d});
S.jar+=nq-p.q;p.q=nq;p.u=nu;p.d=$('dd').value||p.d;p.note=$('dn').value.trim();save();closeSh();render();toast('Produksi diperbarui, stok disesuaikan')}
let ldT=0;const LDM=['Membangunkan Google Sheet…','Menghitung jar satu per satu…','Mengajak walet terbang membawa data…','Menyusun sarang angka…','Hampir selesai, sabar ya…'];
function showLoader(){let i=0;$('app').innerHTML=`<div class="ld">${avatar('prod',130,1)}<div class="ldj"><span>🍯</span><span>🪺</span><span>🍯</span></div><b id="ldm">${LDM[0]}</b><div class="mu">Byza Nutri Indonesia</div><div class="ldb"><i></i></div></div>`;clearInterval(ldT);ldT=setInterval(()=>{const e=$('ldm');if(!e){clearInterval(ldT);return}i=(i+1)%LDM.length;e.textContent=LDM[i]},1800)}
function seed(){const P=[['Iwalet Regular',3,45000,'🐣'],['Iwalet Promo',6,38000,'🐣'],['Iwalet Premium',2,65000,'🐣'],['Iwalet Red Go',3,55000,'🐣'],['Patahan',0,30000,'🐣'],['Mangkuk',0,90000,'🐣']].map(a=>({id:uid(),n:a[0],j:a[1],pr:a[2],e:a[3],st:a[1]?0:10}));

async function openScan(){const el=$('sc');el.innerHTML=`<div class="scb"><div class="hd"><h2>Scan barcode</h2><button class="x" onclick="stopScan()" aria-label="Tutup">✕</button></div><video id="sv" playsinline muted></video><p class="mu" id="sm">Arahkan kamera ke barcode resi atau pesanan.</p><label class="btn lt" style="display:block;text-align:center;cursor:pointer">📷 Foto label resi (baca otomatis)<input type="file" accept="image/*" capture="environment" hidden onchange="labelPhoto(this)"></label></div>`;el.classList.add('on');
try{if('BarcodeDetector' in window){const bd=new BarcodeDetector();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('sv');v.srcObject=stream;await v.play();const tick=async()=>{if(!stream)return;try{const r=await bd.detect(v);if(r.length)return gotCode(r[0].rawValue)}catch(e){}raf=requestAnimationFrame(tick)};tick()}else{await loadZX();zx=new ZXing.BrowserMultiFormatReader();zx.decodeFromVideoDevice(null,'sv',r=>{if(r)gotCode(r.getText())})}}catch(e){const m=$('sm');if(m)m.textContent='Kamera tidak bisa dibuka. Pakai Ambil foto barcode atau ketik nomor manual.'}}
function go(t){tab=t;render();scrollTo(0,0)}
function render(){if(tab==='set'&&!adm())tab='home';const T={home:vHome,sales:vSales,prod:vProd,stock:vStock,buy:vBuy,set:vSet}[tab]();
const nav=[['home','🏠','Beranda'],['sales','🧾','Penjualan'],['prod','🏭','Produksi'],['stock','📦','Stok'],['buy','🛒','Belanja'],...(adm()?[['set','⚙️','Atur']]:[])],fab={sales:'sale',prod:'prod',buy:'buy'}[tab],h=new Date().getHours(),gr=h<11?'pagi':h<15?'siang':h<18?'sore':'malam';
$('app').innerHTML=`<div class="top"><div class="g"><small>Selamat ${gr},</small><h1>${{home:'Tim Byza',sales:'Penjualan',prod:'Produksi',stock:'Stok',buy:'Belanja',set:'Pengaturan'}[tab]}</h1></div><span id="net" class="badge"></span><select class="role" onchange="setRole(this.value)" aria-label="Peran">${[['staff','Karyawan'],['admin','Admin'],['owner','Owner']].map(r=>`<option value="${r[0]}" ${ROLE===r[0]?'selected':''}>${r[1]}</option>`).join('')}</select></div>${T}
${fab?`<button class="fab" onclick="openAdd('${fab}')" aria-label="Tambah">+</button>`:''}<div class="nav"><div>${nav.map(n=>`<button class="${tab===n[0]?'on':''}" onclick="go('${n[0]}')" aria-label="${n[2]}">${n[1]}<span>${n[2]}</span></button>`).join('')}</div></div>`;
setNet(net);clearTimeout(render.t);if(Date.now()-S.lp<3e5)render.t=setTimeout(render,3e5-(Date.now()-S.lp)+500)}
function inPer(d){const t=today();if(per==='hari')return d===t;if(per==='7'){const a=new Date();a.setDate(a.getDate()-6);return d>=a.toLocaleDateString('sv')&&d<=t}if(per==='bulan')return d.startsWith(t.slice(0,7));return true}

const sold=(pid,pre)=>S.sales.filter(s=>s.d.startsWith(pre)).reduce((a,s)=>a+s.items.filter(i=>i.p===pid).reduce((b,i)=>b+i.q,0),0);
function saleCard(s){const it=s.items.map(i=>i.q+'× '+PP(i.p).n).join(', ');
return`<div class="card"><div class="row sp"><b>${s.no||'Tanpa nomor'}</b><div class="row">${s.s==='Proses'?avatar('pack',34,1):''}<select class="st badge ${bc(s.s)}" onchange="setSt('${s.id}',this.value)" aria-label="Status">${ST.map(x=>`<option ${x===s.s?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="mu" style="margin:4px 0 8px">${s.ch} · ${s.d}</div>${s.cu||s.rs?`<div class="mu" style="margin-bottom:6px">👤 ${esc(s.cu||'-')}${s.ex||s.rs?' · '+esc(s.ex||'')+' '+esc(s.rs||''):''} ${s.rs?`<a href="https://www.google.com/search?q=${encodeURIComponent((s.ex||'')+' '+s.rs)}" target="_blank" rel="noopener" style="color:var(--ac);font-weight:700">Lacak resi</a>`:''}</div>`:''}<div style="font-size:14px">${it}</div>${s.bk?`<img class="th" style="margin-top:8px" src="${s.bk}" onclick="showProof('${s.id}')" alt="Bukti kirim">`:''}${own()||adm()?`<div class="row sp" style="margin-top:10px"><b style="color:var(--ac)">${own()?rp(tot(s)):''}</b>${adm()?`<button class="btn sm rd" onclick="delSale('${s.id}')">Hapus</button>`:''}</div>`:''}</div>`}
function vSales(){const l=S.sales.filter(s=>flt==='Semua'||s.s===flt);
return`<div class="chips">${['Semua',...ST].map(x=>`<button class="chip ${flt===x?'on':''}" onclick="flt='${x}';render()">${x}</button>`).join('')}</div>${own()?`<div class="card row sp"><span class="mu">Total ${flt==='Semua'?'semua pesanan':flt}</span><b>${rp(l.reduce((a,s)=>a+tot(s),0))}</b></div>`:''}${l.map(saleCard).join('')||'<div class="empty">Belum ada pesanan. Ketuk + untuk mencatat.</div>'}`}
function setSt(id,v){const s=S.sales.find(x=>x.id===id);if(v==='Terkirim'&&!s.bk){render();return openProof(id)}s.s=v;save();render()}
function openProof(id){tmp={};sh('Bukti foto kirim',`<p class="mu" style="margin-top:0">Lampirkan foto resi atau paket sebelum status menjadi Terkirim.</p><div class="pick"><label>📦 Ambil atau pilih foto<input type="file" accept="image/*" onchange="pic(this,'bk')"><div id="p_bk"></div></label></div><button class="btn" onclick="saveProof('${id}')">Simpan dan tandai terkirim</button>`)}
function saveProof(id){if(tmp.up>0)return toast('Foto masih diunggah, tunggu sebentar');if(!tmp.bk)return toast('Lampirkan foto bukti kirim');const s=S.sales.find(x=>x.id===id);s.bk=tmp.bk;s.s='Terkirim';save();closeSh();render();toast('Pesanan terkirim')}
function showProof(id){sh('Bukti kirim',`<img src="${S.sales.find(x=>x.id===id).bk}" style="width:100%;border-radius:18px" alt="Bukti kirim">`)}
function takeOut(i,sg){if(i.kd)for(const m in i.kd){const x=S.M.find(y=>y.id===m);if(x)x.st-=sg*i.kd[m]}if(i.j>0)S.jar-=sg*i.q*i.j;else{const p=S.P.find(x=>x.id===i.p);if(p)p.st-=sg*i.q}}
function delSale(id){S.sales.find(x=>x.id===id).items.forEach(i=>takeOut(i,-1));S.sales=S.sales.filter(x=>x.id!==id);save();render();toast('Pesanan dihapus, stok dikembalikan')}
function vProd(){const d=today(),t=S.prod.filter(p=>p.d===d).reduce((a,p)=>a+p.q,0),rec=Date.now()-S.lp<3e5;
return`<div class="card row" style="margin-top:16px">${avatar('prod',84,rec)}<div><div class="mu">Produksi hari ini</div><b style="font-size:34px">${t}</b> <span class="mu">jar</span><div class="mu">Stok jar: ${S.jar}</div></div></div><h3>Catatan produksi</h3>
${S.prod.map(p=>`<div class="card row sp" style="cursor:pointer" onclick="openProdDetail('${p.id}')"><div><b>${p.q} jar</b><div class="mu">${p.d}${p.note?' · '+esc(p.note):''}</div><div class="mu" style="color:var(--ac)">Lihat komposisi ›</div></div>${adm()?`<button class="btn sm rd" onclick="event.stopPropagation();delProd('${p.id}')">Hapus</button>`:''}</div>`).join('')||'<div class="empty">Belum ada produksi. Ketuk + untuk mencatat.</div>'}`}
function applyProd(q,sg){S.jar+=sg*q;for(const m in S.R){const x=S.M.find(y=>y.id===m);if(x)x.st-=sg*q*S.R[m]}}
function delProd(id){const p=S.prod.find(x=>x.id===id);S.jar-=p.q;const uu=prodUse(p);for(const m in uu){const x=S.M.find(y=>y.id===m);if(x)x.st+=uu[m]}S.prod=S.prod.filter(x=>x.id!==id);save();render();toast('Produksi dihapus, stok dikembalikan')}
const prodOpts=()=>S.P.map(p=>`<option value="${p.id}">${p.n} · ${p.j?p.j+' jar':'stok '+p.st}</option>`).join('');
function addRow(){const d=document.createElement('div');d.className='irow';d.innerHTML=`<select class="ip">${prodOpts()}</select><input class="iq" type="number" min="1" value="1" inputmode="numeric">`;$('rows').appendChild(d)}
const FORM={
sale:()=>`<label>Marketplace</label><select id="ch">${CH.map(c=>`<option>${c}</option>`).join('')}</select><label>Nomor pesanan</label><div class="irow" style="grid-template-columns:1fr auto"><input id="no" placeholder="Ketik atau scan"><button class="btn sm lt" style="margin:5px 0 12px" onclick="openScan()">📷 Scan label</button></div><details id="dt" style="margin-bottom:12px"><summary>Pelanggan dan pengiriman</summary><div style="margin-top:10px"><label>Nama pelanggan</label><input id="cu"><label>No. HP</label><input id="hp" inputmode="tel"><label>Alamat</label><input id="al"><div class="irow" style="grid-template-columns:1fr 1fr"><div><label>Ekspedisi</label><input id="ex" placeholder="SPX, J&amp;T…"></div><div><label>No. resi</label><input id="rs"></div></div></div></details><label>Status</label><select id="ss" onchange="$('pf').style.display=this.value==='Terkirim'?'flex':'none'">${ST.map(c=>`<option>${c}</option>`).join('')}</select><div class="pick" id="pf" style="display:none"><label>📦 Bukti foto kirim<input type="file" accept="image/*" onchange="pic(this,'bk')"><div id="p_bk"></div></label></div><label>Produk dan jumlah (stok jar ${S.jar})</label><div id="rows"></div><button class="btn sm lt" onclick="addRow()" style="margin-bottom:14px">+ Tambah produk</button><button class="btn" onclick="saveSale()">Simpan</button>`,
prod:()=>{const c=Object.keys(S.R).filter(m=>S.R[m]>0).map(m=>S.R[m]+' '+MM(m).u+' '+MM(m).n).join(', ');return`<label>Jumlah jar diproduksi</label><input id="pq" type="number" min="1" inputmode="numeric" placeholder="0" oninput="calcProd()"><label>Tanggal</label><input id="pd" type="date" value="${today()}"><label>Catatan (opsional)</label><input id="pn" placeholder="opsional"><div id="pcalc" class="card" style="margin-bottom:14px"></div><button class="btn" onclick="saveProd()">Simpan</button>`},
buy:()=>`<label>Nama item</label><input id="bn" placeholder="Contoh: Gula batu 10 kg"><label>Jumlah (opsional)</label><input id="bq" placeholder="10 kg"><label>Nilai belanja (Rp)</label><input id="bv" type="number" inputmode="numeric" placeholder="0"><label>Pembayaran</label><select id="bp"><option>Lunas</option><option>Pending</option></select>
<div class="pick"><label>📄 Foto nota<input type="file" accept="image/*" onchange="pic(this,'f1')"><div id="p_f1"></div></label><label>📷 Foto belanjaan<input type="file" accept="image/*" onchange="pic(this,'f2')"><div id="p_f2"></div></label></div>
<label>Tambah ke stok bahan (opsional)</label><div class="irow"><select id="bm"><option value="">Tidak</option>${S.M.map(m=>`<option value="${m.id}">${m.n} (${m.u})</option>`).join('')}</select><input id="bs" type="number" placeholder="Jml"></div><button class="btn" onclick="saveBuy()">Simpan</button>`};
function openAdd(t){tmp={};sh('Catat transaksi',`<div class="seg">${[['sale','Penjualan'],['prod','Produksi'],['buy','Belanja']].map(x=>`<button class="${t===x[0]?'on':''}" onclick="openAdd('${x[0]}')">${x[1]}</button>`).join('')}</div>`+FORM[t]());if(t==='sale')addRow();if(t==='prod')calcProd()}
function saveSale(){if(tmp.up>0)return toast('Foto masih diunggah, tunggu sebentar');const dn=$('no').value.trim(),dr=$('rs').value.trim();if((dn&&S.sales.some(s=>s.no===dn))||(dr&&S.sales.some(s=>s.rs===dr)))return toast('Nomor pesanan ini sudah tercatat');const ps=[...document.querySelectorAll('.ip')],qs=[...document.querySelectorAll('.iq')],m={};ps.forEach((p,i)=>m[p.value]=(m[p.value]||0)+(+qs[i].value||0));let nj=0;
for(const k in m){const p=PP(k);if(m[k]<=0)return toast('Jumlah harus lebih dari 0');if(p.j>0)nj+=m[k]*p.j;else if(m[k]>p.st)return toast('Stok '+p.n+' tidak cukup (sisa '+p.st+')')}
if(nj>S.jar)return toast('Stok jar kurang: butuh '+nj+' jar, tersedia '+S.jar);
const st=$('ss').value;if(st==='Terkirim'&&!tmp.bk)return toast('Lampirkan foto bukti kirim');const items=Object.keys(m).map(k=>({p:k,q:m[k],pr:PP(k).pr,j:PP(k).j,kd:pkUse(k,m[k])}));items.forEach(i=>takeOut(i,1));
S.sales.unshift({id:uid(),t:Date.now(),d:today(),ch:$('ch').value,no:$('no').value.trim(),s:st,items,bk:st==='Terkirim'?tmp.bk:'',cu:$('cu').value.trim(),hp:$('hp').value.trim(),al:$('al').value.trim(),ex:$('ex').value.trim(),rs:$('rs').value.trim()});save();closeSh();
if(st==='Proses')work('pack','Memproses pesanan…',()=>{render();toast('Pesanan tersimpan, '+nj+' jar keluar')});else{render();toast('Pesanan tersimpan')}}
function saveProd(){const q=+$('pq').value;if(!(q>0))return toast('Isi jumlah jar');const u={};S.M.forEach(m=>{const c=S.R[m.id]||0;if(c>0)u[m.id]=c*q});applyProd(q,1);S.prod.unshift({id:uid(),t:Date.now(),d:$('pd').value||today(),q,note:$('pn').value.trim(),u});S.lp=Date.now();save();closeSh();
work('prod','Sedang produksi '+q+' jar…',()=>{render();const n=S.M.filter(m=>m.st<0).map(m=>m.n);toast(n.length?'Tersimpan. Stok kurang: '+n.join(', '):'Produksi tersimpan, stok jar +'+q)})}
function pic(el,k){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,560/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.6);tmp[k]=d;$('p_'+k).innerHTML='<img src="'+d+'" alt="">'};im.src=r.result};r.readAsDataURL(f)}
function saveBuy(){if(tmp.up>0)return toast('Foto masih diunggah, tunggu sebentar');const n=$('bn').value.trim(),v=+$('bv').value;if(!n||!(v>0))return toast('Isi nama item dan nilai belanja');const m=$('bm').value,q=+$('bs').value;if(m&&q>0)S.M.find(x=>x.id===m).st+=q;
S.buys.unshift({id:uid(),t:Date.now(),d:today(),n,q:$('bq').value.trim(),v,pay:$('bp').value,f1:tmp.f1||'',f2:tmp.f2||'',bm:m,bs:q>0?q:0});save();closeSh();render();toast('Belanja tersimpan')}
function vStock0(){const out={},day={};let inn=0,keluar=0;S.prod.filter(p=>inPer(p.d)).forEach(p=>{inn+=p.q;(day[p.d]=day[p.d]||{p:0,k:0,u:0}).p+=p.q});S.sales.filter(s=>inPer(s.d)).forEach(s=>s.items.forEach(i=>{out[i.p]=(out[i.p]||0)+i.q;const k=i.j>0?i.q*i.j:0;keluar+=k;const o=day[s.d]=day[s.d]||{p:0,k:0,u:0};o.k+=k;o.u+=i.q}));const days=Object.keys(day).sort().reverse();

<h3>Bahan baku</h3>${S.M.filter(m=>m.k!=='sek').map(matRow).join('')}<h3>Bahan baku sekunder</h3>${S.M.filter(m=>m.k==='sek').map(matRow).join('')}${adm()?'<p class="mu">Ketuk jar, bahan, atau produk stok sendiri untuk koreksi.</p>':''}`}
function openAdj(k,id){const o=k==='J'?{n:'stok jar',st:S.jar}:k==='P'?PP(id):MM(id);sh('Koreksi '+o.n,`<label>Stok sebenarnya</label><input id="av" type="number" value="${o.st}" inputmode="numeric"><button class="btn" onclick="doAdj('${k}','${id}')">Simpan</button>`)}
