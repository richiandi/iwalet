low=S.P.filter(p=>p.j===0&&p.st<5).length+(S.jar<10?1:0),mlow=S.M.filter(m=>m.st<=0).length;
return`<div class="hero">${own()?`<button class="eye" onclick="show=!show;render()" aria-label="Tampilkan nominal">${show?'🙈':'👁'}</button>`:''}<small>Stok jar tersedia</small><div class="big">${S.jar} <span>jar</span></div>
<div class="hrow">${own()?`<div><small>Omzet ${bln}</small><b>${mk(om)}</b></div><div><small>Belanja ${bln}</small><b>${mk(bl)}</b></div>`:`<div><small>Produksi hari ini</small><b>${pj} jar</b></div><div><small>Pesanan hari ini</small><b>${ts.length} pesanan</b></div>`}</div></div>
<div class="qa"><button class="btn" onclick="openAdd('sale')">＋ Penjualan</button><button class="btn lt" onclick="openAdd('prod')">🏭 Produksi</button><button class="btn lt" onclick="openAdd('buy')">🛒 Belanja</button></div>
<div class="card row" style="margin-top:14px">${avatar(rec?'prod':'pack',84,busy)}<div><b>${busy?'Tim sedang bekerja':'Tim siap bekerja'}</b><div class="mu" style="margin-top:4px">${rec?'Produksi jar baru saja dicatat<br>':''}${pr?pr+' pesanan sedang diproses':!rec?'Belum ada pesanan diproses':''}</div></div></div>
<h3>Produk terjual <small>${new Date().toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</small></h3>
<div class="grid">${S.P.map((p,i)=>{const t=sold(p.id,d);return`<div class="pc" style="background:${PC[i%4]}"><div class="pe">${p.e}</div><span>${p.n}</span><b>${t}</b><small>terjual hari ini</small><small>Bulan ini ${sold(p.id,ym)}${p.j?' · '+t*p.j+' jar keluar':''}</small></div>`}).join('')}</div>
<h3>Perlu perhatian</h3>${S.jar<10?`<div class="card row sp"><div><b>Stok jar menipis</b><div class="mu">Tersisa ${S.jar} jar</div></div><button class="btn sm lt" onclick="go('stock')">Lihat</button></div>`:''}
${mlow?`<div class="card row sp"><div><b>${mlow} bahan baku habis</b><div class="mu">Stok 0 atau minus</div></div><button class="btn sm lt" onclick="go('stock')">Lihat</button></div>`:''}
${pend?`<div class="card row sp"><div><b>${pend} belanja belum lunas</b><div class="mu">${adm()?'Tandai lunas di tab Belanja':'Menunggu admin'}</div></div><button class="btn sm lt" onclick="go('buy')">Lihat</button></div>`:''}${!low&&!mlow&&!pend?'<div class="empty">Semua aman 🎉</div>':''}
<h3>Pesanan terbaru <small onclick="go('sales')" style="color:var(--ac);font-weight:700">Lihat semua</small></h3>${S.sales.slice(0,3).map(saleCard).join('')||'<div class="empty">Belum ada pesanan.</div>'}
${adm()?'<button class="btn gh" onclick="openSet()">⚙️ Pengaturan komposisi, harga, bahan</button>':''}`}
function saleCard(s){const it=s.items.map(i=>i.q+'× '+PP(i.p).n).join(', ');
return`<div class="card"><div class="row sp"><b>${s.no||'Tanpa nomor'}</b><div class="row">${s.s==='Proses'?avatar('pack',34,1):''}<select class="st badge ${bc(s.s)}" onchange="setSt('${s.id}',this.value)" aria-label="Status">${ST.map(x=>`<option ${x===s.s?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="mu" style="margin:4px 0 8px">${s.ch} · ${s.d}</div><div style="font-size:14px">${it}</div>${s.bk?`<img class="th" style="margin-top:8px" src="${s.bk}" onclick="showProof('${s.id}')" alt="Bukti kirim">`:''}${own()||adm()?`<div class="row sp" style="margin-top:10px"><b style="color:var(--ac)">${own()?rp(tot(s)):''}</b>${adm()?`<button class="btn sm rd" onclick="delSale('${s.id}')">Hapus</button>`:''}</div>`:''}</div>`}
function vSales(){const l=S.sales.filter(s=>flt==='Semua'||s.s===flt);
return`<div class="chips">${['Semua',...ST].map(x=>`<button class="chip ${flt===x?'on':''}" onclick="flt='${x}';render()">${x}</button>`).join('')}</div>${own()?`<div class="card row sp"><span class="mu">Total ${flt==='Semua'?'semua pesanan':flt}</span><b>${rp(l.reduce((a,s)=>a+tot(s),0))}</b></div>`:''}${l.map(saleCard).join('')||'<div class="empty">Belum ada pesanan. Ketuk + untuk mencatat.</div>'}`}
function setSt(id,v){const s=S.sales.find(x=>x.id===id);if(v==='Terkirim'&&!s.bk){render();return openProof(id)}s.s=v;save();render()}
function openProof(id){tmp={};sh('Bukti foto kirim',`<p class="mu" style="margin-top:0">Lampirkan foto resi atau paket sebelum status menjadi Terkirim.</p><div class="pick"><label>📦 Ambil atau pilih foto<input type="file" accept="image/*" onchange="pic(this,'bk')"><div id="p_bk"></div></label></div><button class="btn" onclick="saveProof('${id}')">Simpan dan tandai terkirim</button>`)}
function saveProof(id){if(tmp.up>0)return toast('Foto masih diunggah, tunggu sebentar');if(!tmp.bk)return toast('Lampirkan foto bukti kirim');const s=S.sales.find(x=>x.id===id);s.bk=tmp.bk;s.s='Terkirim';save();closeSh();render();toast('Pesanan terkirim')}
function showProof(id){sh('Bukti kirim',`<img src="${S.sales.find(x=>x.id===id).bk}" style="width:100%;border-radius:18px" alt="Bukti kirim">`)}
function takeOut(i,sg){if(i.j>0)S.jar-=sg*i.q*i.j;else{const p=S.P.find(x=>x.id===i.p);if(p)p.st-=sg*i.q}}
function delSale(id){S.sales.find(x=>x.id===id).items.forEach(i=>takeOut(i,-1));S.sales=S.sales.filter(x=>x.id!==id);save();render();toast('Pesanan dihapus, stok dikembalikan')}
function vProd(){const d=today(),t=S.prod.filter(p=>p.d===d).reduce((a,p)=>a+p.q,0),rec=Date.now()-S.lp<3e5;
return`<div class="card row" style="margin-top:16px">${avatar('prod',84,rec)}<div><div class="mu">Produksi hari ini</div><b style="font-size:34px">${t}</b> <span class="mu">jar</span><div class="mu">Stok jar: ${S.jar}</div></div></div><h3>Catatan produksi</h3>
${S.prod.map(p=>`<div class="card row sp"><div><b>${p.q} jar</b><div class="mu">${p.d}${p.note?' · '+p.note:''}</div></div>${adm()?`<button class="btn sm rd" onclick="delProd('${p.id}')">Hapus</button>`:''}</div>`).join('')||'<div class="empty">Belum ada produksi. Ketuk + untuk mencatat.</div>'}`}
function applyProd(q,sg){S.jar+=sg*q;for(const m in S.R){const x=S.M.find(y=>y.id===m);if(x)x.st-=sg*q*S.R[m]}}
function delProd(id){const p=S.prod.find(x=>x.id===id);applyProd(p.q,-1);S.prod=S.prod.filter(x=>x.id!==id);save();render();toast('Produksi dihapus, stok dikembalikan')}
const prodOpts=()=>S.P.map(p=>`<option value="${p.id}">${p.n} · ${p.j?p.j+' jar':'stok '+p.st}</option>`).join('');
function addRow(){const d=document.createElement('div');d.className='irow';d.innerHTML=`<select class="ip">${prodOpts()}</select><input class="iq" type="number" min="1" value="1" inputmode="numeric">`;$('rows').appendChild(d)}
const FORM={
sale:()=>`<label>Marketplace</label><select id="ch">${CH.map(c=>`<option>${c}</option>`).join('')}</select><label>Nomor pesanan</label><div class="irow" style="grid-template-columns:1fr auto"><input id="no" placeholder="Ketik atau scan"><button class="btn sm lt" style="margin:5px 0 12px" onclick="openScan()">📷 Scan</button></div><label>Status</label><select id="ss" onchange="$('pf').style.display=this.value==='Terkirim'?'flex':'none'">${ST.map(c=>`<option>${c}</option>`).join('')}</select><div class="pick" id="pf" style="display:none"><label>📦 Bukti foto kirim<input type="file" accept="image/*" onchange="pic(this,'bk')"><div id="p_bk"></div></label></div><label>Produk dan jumlah (stok jar ${S.jar})</label><div id="rows"></div><button class="btn sm lt" onclick="addRow()" style="margin-bottom:14px">+ Tambah produk</button><button class="btn" onclick="saveSale()">Simpan</button>`,
prod:()=>{const c=Object.keys(S.R).filter(m=>S.R[m]>0).map(m=>S.R[m]+' '+MM(m).u+' '+MM(m).n).join(', ');return`<label>Jumlah jar diproduksi</label><input id="pq" type="number" min="1" inputmode="numeric" placeholder="0"><label>Tanggal</label><input id="pd" type="date" value="${today()}"><label>Catatan (opsional)</label><input id="pn" placeholder="opsional"><p class="mu" style="margin:0 0 14px">Komposisi per jar: ${c||'belum diatur admin'}. Bahan baku terpotong otomatis.</p><button class="btn" onclick="saveProd()">Simpan</button>`},
buy:()=>`<label>Nama item</label><input id="bn" placeholder="Contoh: Gula batu 10 kg"><label>Jumlah (opsional)</label><input id="bq" placeholder="10 kg"><label>Nilai belanja (Rp)</label><input id="bv" type="number" inputmode="numeric" placeholder="0"><label>Pembayaran</label><select id="bp"><option>Lunas</option><option>Pending</option></select>
<div class="pick"><label>📄 Foto nota<input type="file" accept="image/*" onchange="pic(this,'f1')"><div id="p_f1"></div></label><label>📷 Foto belanjaan<input type="file" accept="image/*" onchange="pic(this,'f2')"><div id="p_f2"></div></label></div>
<label>Tambah ke stok bahan (opsional)</label><div class="irow"><select id="bm"><option value="">Tidak</option>${S.M.map(m=>`<option value="${m.id}">${m.n} (${m.u})</option>`).join('')}</select><input id="bs" type="number" placeholder="Jml"></div><button class="btn" onclick="saveBuy()">Simpan</button>`};
function openAdd(t){tmp={};sh('Catat transaksi',`<div class="seg">${[['sale','Penjualan'],['prod','Produksi'],['buy','Belanja']].map(x=>`<button class="${t===x[0]?'on':''}" onclick="openAdd('${x[0]}')">${x[1]}</button>`).join('')}</div>`+FORM[t]());if(t==='sale')addRow()}
function saveSale(){if(tmp.up>0)return toast('Foto masih diunggah, tunggu sebentar');const dn=$('no').value.trim();if(dn&&S.sales.some(s=>s.no===dn))return toast('Nomor pesanan ini sudah tercatat');const ps=[...document.querySelectorAll('.ip')],qs=[...document.querySelectorAll('.iq')],m={};ps.forEach((p,i)=>m[p.value]=(m[p.value]||0)+(+qs[i].value||0));let nj=0;
for(const k in m){const p=PP(k);if(m[k]<=0)return toast('Jumlah harus lebih dari 0');if(p.j>0)nj+=m[k]*p.j;else if(m[k]>p.st)return toast('Stok '+p.n+' tidak cukup (sisa '+p.st+')')}
if(nj>S.jar)return toast('Stok jar kurang: butuh '+nj+' jar, tersedia '+S.jar);
const st=$('ss').value;if(st==='Terkirim'&&!tmp.bk)return toast('Lampirkan foto bukti kirim');const items=Object.keys(m).map(k=>({p:k,q:m[k],pr:PP(k).pr,j:PP(k).j}));items.forEach(i=>takeOut(i,1));
S.sales.unshift({id:uid(),d:today(),ch:$('ch').value,no:$('no').value.trim(),s:st,items,bk:st==='Terkirim'?tmp.bk:''});save();closeSh();
if(st==='Proses')work('pack','Memproses pesanan…',()=>{render();toast('Pesanan tersimpan, '+nj+' jar keluar')});else{render();toast('Pesanan tersimpan')}}
function saveProd(){const q=+$('pq').value;if(!(q>0))return toast('Isi jumlah jar');applyProd(q,1);S.prod.unshift({id:uid(),d:$('pd').value||today(),q,note:$('pn').value.trim()});S.lp=Date.now();save();closeSh();
work('prod','Sedang produksi '+q+' jar…',()=>{render();const n=S.M.filter(m=>m.st<0).map(m=>m.n);toast(n.length?'Tersimpan. Stok kurang: '+n.join(', '):'Produksi tersimpan, stok jar +'+q)})}
function pic(el,k){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,560/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.6);tmp[k]='';$('p_'+k).innerHTML='<img src="'+d+'" alt="">';tmp.up=(tmp.up||0)+1;GS.withSuccessHandler(u=>{tmp[k]=u;tmp.up--}).withFailureHandler(()=>{tmp.up--;toast('Gagal mengunggah foto, coba lagi')}).uploadImg(d)};im.src=r.result};r.readAsDataURL(f)}
function saveBuy(){if(tmp.up>0)return toast('Foto masih diunggah, tunggu sebentar');const n=$('bn').value.trim(),v=+$('bv').value;if(!n||!(v>0))return toast('Isi nama item dan nilai belanja');const m=$('bm').value,q=+$('bs').value;if(m&&q>0)S.M.find(x=>x.id===m).st+=q;
S.buys.unshift({id:uid(),d:today(),n,q:$('bq').value.trim(),v,pay:$('bp').value,f1:tmp.f1||'',f2:tmp.f2||''});save();closeSh();render();toast('Belanja tersimpan')}
function vStock(){const out={},day={};let inn=0,keluar=0;S.prod.filter(p=>inPer(p.d)).forEach(p=>{inn+=p.q;(day[p.d]=day[p.d]||{p:0,k:0,u:0}).p+=p.q});S.sales.filter(s=>inPer(s.d)).forEach(s=>s.items.forEach(i=>{out[i.p]=(out[i.p]||0)+i.q;const k=i.j>0?i.q*i.j:0;keluar+=k;const o=day[s.d]=day[s.d]||{p:0,k:0,u:0};o.k+=k;o.u+=i.q}));const days=Object.keys(day).sort().reverse();
return`<div class="chips">${[['hari','Hari ini'],['7','7 hari'],['bulan','Bulan ini'],['semua','Semua']].map(x=>`<button class="chip ${per===x[0]?'on':''}" onclick="per='${x[0]}';render()">${x[1]}</button>`).join('')}</div><div class="hero" ${adm()?`onclick="openAdj('J','')"`:''} style="margin-top:6px"><small>Stok jar saat ini</small><div class="big">${S.jar} <span>jar</span></div><div class="hrow"><div><small>Produksi (periode)</small><b>${inn} jar</b></div><div><small>Keluar (periode)</small><b>${keluar} jar</b></div></div></div>
<div class="card"><b>Bisa jadi berapa paket</b><div class="mu" style="margin-top:6px">${S.P.filter(p=>p.j>0).map(p=>p.n+' '+Math.max(0,Math.floor(S.jar/p.j))+' ('+p.j+' jar)').join(' · ')}</div></div>
<h3>Rekap harian <small>produksi dan keluar</small></h3>${days.map(d=>`<div class="card row sp"><div><b>${fmtD(d)}</b><div class="mu">${day[d].u} unit terjual</div></div><div style="text-align:right"><span class="badge b-ok">Produksi ${day[d].p} jar</span> <span class="badge b-wn">Keluar ${day[d].k} jar</span></div></div>`).join('')||'<div class="empty">Belum ada aktivitas di periode ini.</div>'}<h3>Produk keluar</h3>${S.P.map(p=>`<div class="card row sp"${adm()&&!p.j?` onclick="openAdj('P','${p.id}')"`:''}><div class="row"><span style="font-size:22px">${p.e}</span><div><b>${p.n}</b><div class="mu">${p.j?p.j+' jar per unit':'stok sendiri'}</div></div></div><div style="text-align:right"><span class="badge">Keluar ${out[p.id]||0}</span>${p.j?'':`<div class="mu" style="margin-top:4px">Stok ${p.st}</div>`}</div></div>`).join('')}
<h3>Bahan baku</h3>${S.M.map(m=>`<div class="card row sp" ${adm()?`onclick="openAdj('M','${m.id}')"`:''}><b>${m.n}</b><span class="badge ${m.st<=0?'b-bad':'b-ok'}">${m.st} ${m.u}</span></div>`).join('')}${adm()?'<p class="mu">Ketuk jar, bahan, atau produk stok sendiri untuk koreksi.</p>':''}`}
function openAdj(k,id){const o=k==='J'?{n:'stok jar',st:S.jar}:k==='P'?PP(id):MM(id);sh('Koreksi '+o.n,`<label>Stok sebenarnya</label><input id="av" type="number" value="${o.st}" inputmode="numeric"><button class="btn" onclick="doAdj('${k}','${id}')">Simpan</button>`)}
function doAdj(k,id){const v=+$('av').value;if(k==='J')S.jar=v;else(k==='P'?S.P:S.M).find(x=>x.id===id).st=v;save();closeSh();render()}
function vBuy(){const pend=S.buys.filter(b=>b.pay==='Pending').reduce((a,b)=>a+b.v,0);
return`<div class="hero" style="margin-top:16px"><small>Belum dibayar</small><div class="big" style="font-size:32px">${rp(pend)}</div></div><h3>Riwayat belanja</h3>
${S.buys.map(b=>`<div class="card"><div class="row sp"><b>${b.n}</b><span class="badge ${bc(b.pay)}">${b.pay}</span></div><div class="mu" style="margin:4px 0 8px">${b.d}${b.q?' · '+b.q:''}</div><div class="row">${b.f1?`<img class="th" src="${b.f1}" onclick="showImg('${b.id}','f1')" alt="Foto nota">`:''}${b.f2?`<img class="th" src="${b.f2}" onclick="showImg('${b.id}','f2')" alt="Foto belanjaan">`:''}<b style="margin-left:auto;font-size:17px">${rp(b.v)}</b></div>
${adm()?`<div class="row" style="margin-top:10px;justify-content:flex-end">${b.pay==='Pending'?`<button class="btn sm" onclick="paid('${b.id}')">Tandai lunas</button>`:''}<button class="btn sm rd" onclick="delBuy('${b.id}')">Hapus</button></div>`:''}</div>`).join('')||'<div class="empty">Belum ada belanja. Ketuk + untuk mencatat.</div>'}`}
function showImg(id,k){sh('Foto',`<img src="${S.buys.find(b=>b.id===id)[k]}" style="width:100%;border-radius:18px" alt="Foto">`)}
function paid(id){S.buys.find(b=>b.id===id).pay='Lunas';save();render();toast('Ditandai lunas')}function delBuy(id){S.buys=S.buys.filter(b=>b.id!==id);save();render()}
function openSet(){sh('Pengaturan',`<details open><summary>Komposisi bahan per 1 jar</summary><div style="margin-top:10px">${S.M.map(m=>`<label>${m.n} (${m.u})</label><input id="c_${m.id}" type="number" step="any" value="${S.R[m.id]||0}">`).join('')}</div></details>
<details><summary>Jumlah jar per produk${own()?' dan harga jual':''}</summary><div style="margin-top:10px"><p class="mu" style="margin:0 0 8px">Isi 0 jika produk memakai stok sendiri.</p>${S.P.map(p=>`<label>${p.n}: jar per unit</label><input id="j_${p.id}" type="number" value="${p.j}">${own()?`<label>${p.n}: harga jual (Rp)</label><input id="pr_${p.id}" type="number" value="${p.pr}">`:''}`).join('')}</div></details>
<details><summary>Tambah produk atau bahan</summary><div style="margin-top:10px"><label>Produk baru</label><div class="irow"><input id="np" placeholder="Nama produk"><input id="nj" type="number" placeholder="Jar"></div><label>Bahan baru</label><div class="irow"><input id="nm" placeholder="Nama bahan"><input id="nu" placeholder="Satuan"></div></div></details>
<details><summary>Keamanan PIN</summary><div style="margin-top:10px"><label>PIN baru untuk ${own()?'Owner':'Admin'} (4 sampai 6 angka, kosongkan jika tidak diganti)</label><input id="npn" type="password" inputmode="numeric" maxlength="6" autocomplete="off">${own()?`<button class="btn sm gh" onclick="GS.withSuccessHandler(()=>toast('PIN admin direset. Admin membuat PIN baru saat masuk.')).resetPin('admin',tk.h)">Reset PIN admin</button>`:''}</div></details><button class="btn" style="margin-top:12px" onclick="saveSet()">Simpan pengaturan</button>${own()?`<button class="btn rd" style="margin-top:10px" onclick="resetData(this)">Reset semua data</button>`:''}`)}
function resetData(b){if(!b.dataset.c){b.dataset.c=1;b.textContent='Ketuk lagi untuk menghapus semua data';return}GS.withSuccessHandler(()=>location.reload()).resetAll(tk.h)}
function saveSet(){const pn=$('npn').value;if(pn){if(!/^\d{4,6}$/.test(pn))return toast('PIN harus 4 sampai 6 angka');GS.withSuccessHandler(ok=>{if(ok){tk.h=hp(pn);toast('PIN diganti')}else toast('Gagal ganti PIN')}).setPin(ROLE,hp(pn),tk.h)}S.M.forEach(m=>S.R[m.id]=+$('c_'+m.id).value||0);S.P.forEach(p=>{p.j=+$('j_'+p.id).value||0;if(own()&&$('pr_'+p.id))p.pr=+$('pr_'+p.id).value});
const np=$('np').value.trim(),nm=$('nm').value.trim();if(nm)S.M.push({id:uid(),n:nm,u:$('nu').value.trim()||'pcs',st:0});if(np)S.P.push({id:uid(),n:np,j:+$('nj').value||0,pr:0,e:'🪺',st:0});
save();closeSh();render();toast('Pengaturan tersimpan')}
$('app').innerHTML='<div class="empty">Memuat data dari Google Sheet…</div>';boot();setInterval(poll,20000);
</script></body></html>
